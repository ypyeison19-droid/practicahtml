<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio HTML5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado -->
    <header>
        <h1>Título de la WEB</h1>
    </header>

    <!-- Menú de navegación -->
    <nav>
        <a href="#">IR SECCIÓN 1</a>
        <a href="#">IR SECCIÓN 2</a>
        <a href="#">IR SECCIÓN 3</a>
    </nav>

    <!-- Contenedor principal -->
    <main>

        <!-- Contenido -->
        <section>

            <h2>CONTENIDO PRINCIPAL</h2>

            <article>

                <p>
                    Este es el contenido principal de mi web.
                </p>

                <div>
                    <p>Aquí tienes una imagen.</p>

                    <img src="https://picsum.photos/400/200" alt="Paisaje">
                </div>

            </article>

        </section>

        <!-- Barra lateral -->
        <aside>

            <h3>Banner de publicidad</h3>

            <img src="https://picsum.photos/200/100" alt="Publicidad">

            <h3>Testimonios</h3>

            <p>Me gusta mucho esta página.</p>

        </aside>

    </main>

    <!-- Pie de página -->
    <footer>

        <div>
            <h4>Avisos legales</h4>
            <a href="#">Política de cookies</a>
        </div>

        <div>
            <h4>Redes sociales</h4>
            <a href="#">Mi Facebook</a>
        </div>

    </footer>

</body>
</html>
